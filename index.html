<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제목 없는 스프레드시트</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%2323a566'/%3E%3Cpath d='M6 7h12v2H6zm0 4h12v2H6zm0 4h12v2H6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">

  <!-- ===== 상단 바 ===== -->
  <header class="topbar">
    <div class="topbar__brand" aria-hidden="true">
      <svg viewBox="0 0 40 40" width="34" height="34">
        <path d="M8 3h14l10 10v24a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" fill="#23a566"/>
        <path d="M22 3l10 10H24a2 2 0 0 1-2-2V3z" fill="#1a8a55"/>
        <path d="M12 18h16v13H12z" fill="#fff"/>
        <path d="M12 18h16v3H12zm0 5h6.5v2H12zm9.5 0H28v2h-6.5zM12 27h6.5v2H12zm9.5 0H28v2h-6.5z" fill="#23a566"/>
      </svg>
    </div>

    <div class="topbar__doc">
      <div class="titlerow">
        <span id="docTitle" class="doctitle" tabindex="0" title="더블클릭하여 제목 변경">제목 없는 스프레드시트</span>
        <input id="docTitleInput" class="doctitle__input" maxlength="60" hidden>
        <button class="iconbtn iconbtn--xs" title="별표 표시">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
        <button class="iconbtn iconbtn--xs" title="드라이브로 이동">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </div>

      <nav class="menubar" id="menubar">
        <button class="menubar__item menubar__item--icon" tabindex="-1">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
          <span>메뉴</span>
        </button>
        <button class="menubar__item" tabindex="-1">파일</button>
        <button class="menubar__item" tabindex="-1">수정</button>
        <button class="menubar__item" tabindex="-1">보기</button>
        <button class="menubar__item" tabindex="-1">삽입</button>
        <button class="menubar__item" tabindex="-1">서식</button>
        <button class="menubar__item" tabindex="-1">데이터</button>
        <button class="menubar__item" tabindex="-1">도구</button>
        <button class="menubar__item" tabindex="-1">Gemini</button>
        <button class="menubar__item" tabindex="-1">확장 프로그램</button>
        <button class="menubar__item" tabindex="-1">도움말</button>
      </nav>
    </div>

    <div class="topbar__right">
      <button class="iconbtn topbar__hideable" title="댓글 기록 열기">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 4h16v12H7l-3 3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
      <button class="iconbtn iconbtn--wide topbar__hideable" title="화상 통화">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 7h11v10H3z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M14 11l6-3v8l-6-3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <svg class="caret" viewBox="0 0 24 24" width="14" height="14"><path d="M7 10l5 5 5-5z" fill="currentColor"/></svg>
      </button>
      <button class="sharebtn" title="공유">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 10V8a6 6 0 0 1 12 0v2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="10" width="16" height="10" rx="2" fill="currentColor"/></svg>
        <span>공유</span>
        <svg class="caret" viewBox="0 0 24 24" width="14" height="14"><path d="M7 10l5 5 5-5z" fill="currentColor"/></svg>
      </button>
      <button class="iconbtn topbar__hideable" title="Gemini">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 2l2.2 6.3L20.5 10l-6.3 2.2L12 18.5l-2.2-6.3L3.5 10l6.3-1.7z" fill="#4285f4"/></svg>
      </button>
      <button class="avatar" id="avatarBtn" title="계정 설정">
        <img id="avatarImg" alt="프로필" hidden>
        <svg id="avatarDefault" viewBox="0 0 40 40" width="32" height="32">
          <circle cx="20" cy="20" r="20" fill="#c4c7c5"/>
          <circle cx="20" cy="16" r="6.5" fill="#fff"/>
          <path d="M7 36c1.6-6.6 6.8-10 13-10s11.4 3.4 13 10z" fill="#fff"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ===== 빠른 설정(툴바) ===== -->
  <div class="toolbarrow">
    <div class="toolbar" id="toolbar">
      <div class="toolbar__inner" id="toolbarInner">

        <div class="tbg" data-tbg>
          <button class="tbtn" title="실행취소"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z" fill="currentColor"/></svg></button>
          <button class="tbtn" title="다시실행"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z" fill="currentColor"/></svg></button>
          <button class="tbtn" title="인쇄"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z" fill="currentColor"/></svg></button>
          <button class="tbtn" title="서식 복사"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M18 4V3c0-.55-.45-1-1-1H5c-.55 0-1 .45-1 1v4c0 .55.45 1 1 1h12c.55 0 1-.45 1-1V6h1v4H9v11c0 .55.45 1 1 1h2c.55 0 1-.45 1-1v-9h8V4h-3z" fill="currentColor"/></svg></button>
        </div>

        <div class="tbg" data-tbg>
          <button class="tbtn tbtn--text" title="확대/축소">100%<svg class="caret" viewBox="0 0 24 24" width="14" height="14"><path d="M7 10l5 5 5-5z" fill="currentColor"/></svg></button>
        </div>

        <div class="tbg" data-tbg>
          <button class="tbtn tbtn--glyph" title="통화 형식">₩</button>
          <button class="tbtn tbtn--glyph" title="백분율 형식">%</button>
          <button class="tbtn tbtn--glyph tbtn--sm" title="소수점 이하 자릿수 줄이기">.0</button>
          <button class="tbtn tbtn--glyph tbtn--sm" title="소수점 이하 자릿수 늘리기">.00</button>
          <button class="tbtn tbtn--text" title="추가 형식">123<svg class="caret" viewBox="0 0 24 24" width="14" height="14"><path d="M7 10l5 5 5-5z" fill="currentColor"/></svg></button>
        </div>

        <!-- 글꼴 지정 자리 → 글 선택 도구 (좁아져도 항상 툴바에 남는다) -->
        <div class="tbg" data-tbg data-tbg-pin>
          <button class="tbtn tbtn--select" id="textPickerBtn" title="연습할 글 선택">
            <span id="textPickerLabel">기본값</span>
            <svg class="caret" viewBox="0 0 24 24" width="14" height="14"><path d="M7 10l5 5 5-5z" fill="currentColor"/></svg>
          </button>
        </div>

        <div class="tbg" data-tbg>
          <button class="tbtn tbtn--glyph" id="fontDown" title="글꼴 크기 작게 (최소 10)">−</button>
          <input class="tbfield" id="fontSize" type="text" inputmode="numeric"
                 value="10" maxlength="2" title="글꼴 크기 10~24" aria-label="글꼴 크기">
          <button class="tbtn tbtn--glyph" id="fontUp" title="글꼴 크기 크게 (최대 24)">+</button>
        </div>

        <div class="tbg" data-tbg>
          <button class="tbtn tbtn--glyph tbtn--b" title="굵게">B</button>
          <button class="tbtn tbtn--glyph tbtn--i" title="기울임꼴">I</button>
          <button class="tbtn tbtn--glyph tbtn--s" title="취소선">S</button>
          <button class="tbtn" title="텍스트 색상"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 17L11 5h2l5 12h-2.1l-1.2-3H9.3l-1.2 3H6zm3.9-4.7h4.2L12 7.2z" fill="currentColor"/><rect x="5" y="19" width="14" height="3" fill="#d93025"/></svg></button>
        </div>

        <div class="tbg" data-tbg>
          <button class="tbtn" title="채우기 색상"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 13l7-7 7 7-7 7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M19 15s2 2.2 2 3.4a2 2 0 0 1-4 0c0-1.2 2-3.4 2-3.4z" fill="currentColor"/></svg></button>
          <button class="tbtn" title="테두리"><svg viewBox="0 0 24 24" width="20" height="20"><rect x="3.5" y="3.5" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2"/></svg></button>
          <button class="tbtn" title="셀 병합"><svg viewBox="0 0 24 24" width="20" height="20"><rect x="3.5" y="6.5" width="17" height="11" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v10" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2"/><path d="M7 12h4m2 0h4M9 10l-2 2 2 2m6-4l2 2-2 2" stroke="currentColor" stroke-width="1.4" fill="none"/></svg></button>
        </div>

        <div class="tbg" data-tbg>
          <button class="tbtn tbtn--wide" title="가로 정렬"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 6h16M4 10h10M4 14h16M4 18h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><svg class="caret" viewBox="0 0 24 24" width="14" height="14"><path d="M7 10l5 5 5-5z" fill="currentColor"/></svg></button>
          <button class="tbtn tbtn--wide" title="세로 정렬"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 5h16M6 12h12M4 19h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><svg class="caret" viewBox="0 0 24 24" width="14" height="14"><path d="M7 10l5 5 5-5z" fill="currentColor"/></svg></button>
          <button class="tbtn tbtn--wide" title="줄바꿈"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 6h16M4 12h12a3 3 0 0 1 0 6h-3M4 18h3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M9 15l-3 3 3 3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="caret" viewBox="0 0 24 24" width="14" height="14"><path d="M7 10l5 5 5-5z" fill="currentColor"/></svg></button>
          <button class="tbtn tbtn--wide" title="텍스트 회전"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 18L11 7l6 11M7.5 14h7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg><svg class="caret" viewBox="0 0 24 24" width="14" height="14"><path d="M7 10l5 5 5-5z" fill="currentColor"/></svg></button>
        </div>

        <div class="tbg" data-tbg>
          <button class="tbtn" title="링크 삽입"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z" fill="currentColor"/></svg></button>
          <button class="tbtn" title="댓글 삽입"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 4h16v12H7l-3 3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 7v6M9 10h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
          <button class="tbtn" title="차트 삽입"><svg viewBox="0 0 24 24" width="20" height="20"><rect x="3.5" y="3.5" width="17" height="17" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 16v-4m5 4V8m5 8v-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
          <button class="tbtn" title="필터 만들기"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z" fill="currentColor"/></svg></button>
          <button class="tbtn tbtn--wide" title="함수"><span class="glyph">Σ</span><svg class="caret" viewBox="0 0 24 24" width="14" height="14"><path d="M7 10l5 5 5-5z" fill="currentColor"/></svg></button>
        </div>

      </div>
      <button class="toolbar__more" id="toolbarMore" title="더보기" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="5" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="19" r="1.8" fill="currentColor"/></svg>
      </button>
    </div>
    <button class="collapsebtn" title="메뉴 숨기기">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 14l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="toolbar__overflow" id="toolbarOverflow" hidden></div>

  <!-- ===== 수식 입력줄 ===== -->
  <div class="formulabar">
    <div class="namebox"><span id="nameBox">A1</span><svg class="caret" viewBox="0 0 24 24" width="14" height="14"><path d="M7 10l5 5 5-5z" fill="currentColor"/></svg></div>
    <div class="fbsep"></div>
    <div class="fxmark">fx</div>
    <div class="formulabar__value" id="formulaValue"></div>
  </div>

  <!-- ===== 그리드 영역 ===== -->
  <main class="sheetstage" id="sheetStage"></main>

  <!-- ===== 시트 탭 ===== -->
  <footer class="tabbar">
    <button class="iconbtn iconbtn--sm" title="시트 추가">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="iconbtn iconbtn--sm" title="모든 시트">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="tabbar__sep"></div>
    <div class="tabs" id="tabs"></div>
  </footer>

</div>

<!-- ===== 모달 컨테이너 ===== -->
<div class="modal-root" id="modalRoot" hidden></div>

<script src="js/texts.js"></script>
<script src="js/util.js"></script>
<script src="js/grid.js"></script>
<script src="js/chrome.js"></script>
<script src="js/typing.js"></script>
<script src="js/app.js"></script>
</body>
</html>
